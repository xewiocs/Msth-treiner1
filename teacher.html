<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Панель учителя - Математика 6 класс</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        background: white;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }

      .header {
        text-align: center;
        margin-bottom: 40px;
        padding-bottom: 20px;
        border-bottom: 3px solid #e7f3ff;
      }

      .header h1 {
        color: #1e3c72;
        font-size: 2.5em;
        margin-bottom: 10px;
      }

      .header p {
        color: #666;
        font-size: 1.1em;
      }

      .stats-cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        margin-bottom: 40px;
      }

      .stat-card {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
      }

      .stat-card h3 {
        font-size: 0.9em;
        opacity: 0.9;
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .stat-card .value {
        font-size: 2.5em;
        font-weight: bold;
      }

      .controls {
        display: flex;
        gap: 15px;
        margin-bottom: 30px;
        flex-wrap: wrap;
      }

      .btn {
        padding: 12px 24px;
        border: none;
        border-radius: 10px;
        font-size: 1em;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
      }

      .btn-secondary {
        background: #e7f3ff;
        color: #1e3c72;
      }

      .btn-secondary:hover {
        background: #d0e7ff;
      }

      .students-table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
      }

      .students-table thead {
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        color: white;
      }

      .students-table th {
        padding: 18px;
        text-align: left;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 0.85em;
        letter-spacing: 0.5px;
      }

      .students-table td {
        padding: 16px 18px;
        border-bottom: 1px solid #f0f0f0;
      }

      .students-table tbody tr {
        transition: background 0.2s ease;
      }

      .students-table tbody tr:hover {
        background: #f8f9ff;
      }

      .status-badge {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 0.85em;
        font-weight: 600;
      }

      .status-active {
        background: #d4edda;
        color: #155724;
      }

      .status-inactive {
        background: #f8d7da;
        color: #721c24;
      }

      .progress-bar {
        width: 100%;
        height: 8px;
        background: #e0e0e0;
        border-radius: 10px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        border-radius: 10px;
        transition: width 0.3s ease;
      }

      .link-section {
        background: #e7f3ff;
        padding: 25px;
        border-radius: 15px;
        margin-bottom: 30px;
      }

      .link-section h3 {
        color: #1e3c72;
        margin-bottom: 15px;
      }

      .link-box {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .link-input {
        flex: 1;
        padding: 12px;
        border: 2px solid #d0e7ff;
        border-radius: 8px;
        font-size: 1em;
        font-family: monospace;
      }

      .loading {
        text-align: center;
        padding: 40px;
        color: #666;
        font-size: 1.2em;
      }

      .no-data {
        text-align: center;
        padding: 60px;
        color: #999;
      }

      .no-data h3 {
        margin-bottom: 10px;
        color: #666;
      }

      .clickable-row {
        cursor: pointer;
        transition: background 0.2s ease;
      }

      .clickable-row:hover {
        background: #f0f4ff !important;
      }

      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        z-index: 1000;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .modal.show {
        display: flex;
      }

      .modal-content {
        background: white;
        border-radius: 20px;
        padding: 30px;
        max-width: 600px;
        width: 100%;
        max-height: 80vh;
        overflow-y: auto;
        position: relative;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 2px solid #e7f3ff;
      }

      .modal-header h2 {
        color: #1e3c72;
        font-size: 1.5em;
        margin: 0;
      }

      .close-btn {
        background: none;
        border: none;
        font-size: 2em;
        color: #999;
        cursor: pointer;
        padding: 0;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        transition: all 0.3s ease;
      }

      .close-btn:hover {
        background: #f0f0f0;
        color: #333;
      }

      .mistake-card {
        background: #f8f9ff;
        border-left: 4px solid #e74c3c;
        padding: 15px;
        margin-bottom: 15px;
        border-radius: 8px;
      }

      .mistake-example {
        font-size: 1.3em;
        font-weight: 600;
        color: #1e3c72;
        margin-bottom: 10px;
      }

      .mistake-details {
        font-size: 0.95em;
        color: #666;
      }

      .mistake-details strong {
        color: #333;
      }

      .no-mistakes {
        text-align: center;
        padding: 40px;
        color: #999;
      }

      @media (max-width: 768px) {
        .container {
          padding: 20px;
        }

        .header h1 {
          font-size: 1.8em;
        }

        .students-table {
          font-size: 0.9em;
        }

        .students-table th,
        .students-table td {
          padding: 12px 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>👨‍🏫 Панель учителя</h1>
        <p>Отслеживайте прогресс учеников в реальном времени</p>
      </div>

      <div class="link-section">
        <h3>🔗 Ссылка для учеников</h3>
        <p style="margin-bottom: 15px; color: #666;">
          Отправьте эту ссылку ученикам в чат. Все их результаты будут автоматически синхронизироваться.
        </p>
        <div class="link-box">
          <input
            type="text"
            class="link-input"
            id="student-link"
            readonly
            value="Загрузка..."
          />
          <button class="btn btn-primary" id="copy-link-btn">
            📋 Копировать
          </button>
        </div>
      </div>

      <div class="stats-cards">
        <div class="stat-card">
          <h3>Всего учеников</h3>
          <div class="value" id="total-students">0</div>
        </div>
        <div class="stat-card" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
          <h3>Решено примеров</h3>
          <div class="value" id="total-solved">0</div>
        </div>
        <div class="stat-card" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
          <h3>Средний процент</h3>
          <div class="value" id="avg-percentage">0%</div>
        </div>
      </div>

      <div class="controls">
        <button class="btn btn-primary" id="refresh-btn">
          🔄 Обновить данные
        </button>
        <button class="btn btn-secondary" id="export-btn">
          📊 Экспорт в Excel
        </button>
      </div>

      <div id="table-container">
        <div class="loading">⏳ Загрузка данных...</div>
      </div>
    </div>

    <!-- Модальное окно для ошибок -->
    <div id="mistakes-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="mistakes-title">❌ Неправильные примеры</h2>
          <button class="close-btn" id="close-mistakes">&times;</button>
        </div>
        <div id="mistakes-container"></div>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script>
      let db = null;

      // Инициализация Firebase
      try {
        const firebaseConfig = {
          apiKey: "AIzaSyDdoa8hTe4hUnXZYDbg_OTpv-yzvKW01uA",
          authDomain: "sixclassproject.firebaseapp.com",
          projectId: "sixclassproject",
          storageBucket: "sixclassproject.appspot.com",
          messagingSenderId: "1025060862423",
          appId: "1:1025060862423:web:b65e0b4f8e361ae1e07392",
          measurementId: "G-GY41TSJE2G",
        };
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
      } catch (e) {
        console.error("Firebase initialization error:", e);
      }

      // Устанавливаем ссылку для учеников
      const studentLink = window.location.href.replace('teacher.html', 'index.html');
      document.getElementById('student-link').value = studentLink;

      // Копирование ссылки
      document.getElementById('copy-link-btn').addEventListener('click', () => {
        const linkInput = document.getElementById('student-link');
        linkInput.select();
        document.execCommand('copy');

        const btn = document.getElementById('copy-link-btn');
        const originalText = btn.textContent;
        btn.textContent = '✅ Скопировано!';
        setTimeout(() => {
          btn.textContent = originalText;
        }, 2000);
      });

      // Отрисовка таблицы учеников
      let studentsData = [];

      function renderStudentsTable(students) {
        studentsData = students;
        const container = document.getElementById('table-container');

        if (students.length === 0) {
          container.innerHTML = `
            <div class="no-data">
              <h3>📚 Пока нет учеников</h3>
              <p>Отправьте ссылку ученикам, и их результаты появятся здесь</p>
            </div>
          `;
          return;
        }

        // Сортировка по количеству правильных ответов
        students.sort((a, b) => {
          if (b.correct !== a.correct) return b.correct - a.correct;
          return b.percentage - a.percentage;
        });

        let tableHTML = `
          <table class="students-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Ученик</th>
                <th>✅ Правильно</th>
                <th>❌ Неправильно</th>
                <th>📊 Всего</th>
                <th>% Успеха</th>
                <th>Прогресс</th>
                <th>Дата</th>
              </tr>
            </thead>
            <tbody>
        `;

        students.forEach((student, index) => {
          const statusClass = student.total > 0 ? 'status-active' : 'status-inactive';
          const statusText = student.total > 0 ? 'Активен' : 'Неактивен';
          const hasErrors = student.wrong > 0;
          const rowClass = hasErrors ? 'clickable-row' : '';
          const clickHandler = hasErrors ? `onclick="showMistakes('${student.name.replace(/'/g, "\\'")}')"` : '';

          tableHTML += `
            <tr class="${rowClass}" ${clickHandler}>
              <td><strong>${index + 1}</strong></td>
              <td><strong>${student.name}</strong></td>
              <td style="color: #27ae60; font-weight: 600;">${student.correct}</td>
              <td style="color: #e74c3c; font-weight: 600;">${student.wrong}</td>
              <td><strong>${student.total}</strong></td>
              <td><strong>${student.percentage}%</strong></td>
              <td>
                <div class="progress-bar">
                  <div class="progress-fill" style="width: ${student.percentage}%;"></div>
                </div>
              </td>
              <td>${student.date}</td>
            </tr>
          `;
        });

        tableHTML += `
            </tbody>
          </table>
        `;

        container.innerHTML = tableHTML;
      }

      // Обновление статистики
      function updateStats(students) {
        document.getElementById('total-students').textContent = students.length;

        const totalSolved = students.reduce((sum, s) => sum + s.total, 0);
        document.getElementById('total-solved').textContent = totalSolved;

        const avgPercentage = students.length > 0
          ? Math.round(students.reduce((sum, s) => sum + s.percentage, 0) / students.length)
          : 0;
        document.getElementById('avg-percentage').textContent = avgPercentage + '%';
      }

      // Обработчики событий
      document.getElementById('refresh-btn').addEventListener('click', () => {
        document.getElementById('table-container').innerHTML = '<div class="loading">⏳ Обновление данных...</div>';
        loadStudents();
      });

      document.getElementById('export-btn').addEventListener('click', () => {
        alert('Функция экспорта в Excel будет добавлена в следующей версии!');
      });

      // Функция для показа ошибок ученика
      function showMistakes(studentName) {
        const student = studentsData.find(s => s.name === studentName);
        if (!student) return;

        const mistakes = student.mistakes || [];
        const container = document.getElementById('mistakes-container');
        const title = document.getElementById('mistakes-title');

        title.textContent = `❌ Неправильные примеры (${studentName})`;

        if (mistakes.length === 0) {
          container.innerHTML = '<div class="no-mistakes">Нет ошибок</div>';
        } else {
          container.innerHTML = mistakes.map((mistake, index) => {
            const num2Display = String(mistake.num2).startsWith('-') ? `(${mistake.num2})` : mistake.num2;
            return `
              <div class="mistake-card">
                <div style="font-weight: 600; color: #999; margin-bottom: 8px;">#${index + 1}</div>
                <div class="mistake-example">
                  ${mistake.num1} ${mistake.operator} ${num2Display} = ?
                </div>
                <div class="mistake-details">
                  <div>Правильный ответ: <strong>${mistake.correctAnswer}</strong></div>
                  <div>Ответ ученика: <strong style="color: #e74c3c;">${mistake.userAnswer}</strong></div>
                </div>
              </div>
            `;
          }).join('');
        }

        document.getElementById('mistakes-modal').classList.add('show');
      }

      document.getElementById('close-mistakes').addEventListener('click', () => {
        document.getElementById('mistakes-modal').classList.remove('show');
      });

      document.getElementById('mistakes-modal').addEventListener('click', (e) => {
        if (e.target.id === 'mistakes-modal') {
          document.getElementById('mistakes-modal').classList.remove('show');
        }
      });

      // Обновляем функцию loadStudents для сохранения данных
      function loadStudents() {
        if (!db) {
          document.getElementById('table-container').innerHTML = `
            <div class="no-data">
              <h3>❌ Ошибка подключения к базе данных</h3>
              <p>Проверьте настройки Firebase</p>
            </div>
          `;
          return;
        }

        db.collection('mathResults')
          .get()
          .then((snapshot) => {
            studentsData = [];
            snapshot.forEach((doc) => {
              const data = doc.data();
              studentsData.push({
                name: decodeURIComponent(doc.id),
                correct: data.correct || 0,
                wrong: data.wrong || 0,
                total: data.total || 0,
                mistakes: data.mistakes || [],
                date: data.date || 'Не указана',
                percentage: data.total > 0 ? Math.round((data.correct / data.total) * 100) : 0
              });
            });

            renderStudentsTable(studentsData);
            updateStats(studentsData);
          })
          .catch((error) => {
            console.error('Error loading students:', error);
            document.getElementById('table-container').innerHTML = `
              <div class="no-data">
                <h3>❌ Ошибка загрузки данных</h3>
                <p>${error.message}</p>
              </div>
            `;
          });
      }

      // Автообновление каждые 10 секунд
      setInterval(() => {
        loadStudents();
      }, 10000);

      // Первая загрузка
      loadStudents();
    </script>
  </body>
</html>
